models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.

    data_tests: 
      - min_row_count:
          arguments:
            min_count: 1000
          severity: warn

    columns:
      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The hosts's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values
  - name: dim_host_cleansed
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_tests:
          - not_null
          - unique
        data_type: integer

      - name: host_name
        data_tests:
          - not_null
        data_type: string

      - name: is_superhost
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
        data_type: string
      
      - name: created_at
        data_type: timestamp
      - name: updated_at
        data_type: timestamp